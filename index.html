@keyframes fadeBackdrop{from{opacity:0}to{opacity:1}}

@keyframes gr{from{transform:scaleY(0)}}
@keyframes rg{from{stroke-dasharray:0 251.3}}
.an>*{animation:fi .25s cubic-bezier(0.16,1,0.3,1) both}
.an>*:nth-child(2){animation-delay:.03s}
.an>*:nth-child(3){animation-delay:.06s}

kbd{
  font:11px/1.2 monospace;border:1px solid currentColor;border-radius:4px;
  padding:2px 5px;margin-right:7px;opacity:.75;vertical-align:middle;
}
.pb{height:7px;background:var(--bd);border-radius:4px;margin:10px 0;overflow:hidden}
.pb i{

  border-radius:4px;transition:width .4s ease;
}

.okc{border-color:var(--ok)!important;box-shadow:0 0 0 3px rgba(21,128,61,0.2)!important;animation:pop .3s ease}
.badc{border-color:var(--bad)!important;box-shadow:0 0 0 3px rgba(185,28,28,0.2)!important;animation:sh .35s ease}
.wc{border-color:var(--w)!important;box-shadow:0 0 0 3px rgba(180,83,9,0.2)!important}
.ring{animation:rg .9s ease-out;transition:stroke-dasharray .6s ease}

.chip{
  display:inline-block;padding:8px 12px;margin:3px 4px 3px 0;border:1px solid var(--bd);
  border-radius:99px;background:var(--c);color:var(--t);font:inherit;font-size:13.5px;
  font-weight:500;cursor:pointer;transition:all .15s ease;
}
.chip:hover{border-color:var(--a);background:var(--a-subtle)}
.chip:active{transform:scale(0.94)}
.chip.on{background:var(--a);color:#fff;border-color:var(--a);box-shadow:0 2px 6px var(--a-glow)}
.chip.off{opacity:.45;border-style:dashed}

.menu-dots-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);

}
.menu-dots-btn:hover{background:var(--a-subtle);border-color:var(--a);color:var(--a)}
.menu-dots-btn:active{transform:scale(0.92)}

.drawer-backdrop{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(15,23,42,0.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  z-index:900;opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}

.side-drawer{
  position:fixed;top:0;right:0;bottom:0;width:100%;max-width:440px;
  background:var(--bg);box-shadow:-4px 0 24px rgba(0,0,0,0.22);

  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0;
}
.side-drawer.open{transform:translateX(0)}

.side-drawer-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--c);
  flex-shrink:0;
}
.side-drawer-title{font-size:18px;font-weight:700;color:var(--t);letter-spacing:-0.01em}
.side-drawer-close{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);
  background:var(--c-subtle);color:var(--m);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;font-weight:600;transition:all .15s ease;
}
.side-drawer-close:hover{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-bd)}

.side-drawer-body{
  padding:16px 14px 40px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;
}

.toast-container{
  position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));left:50%;
  transform:translateX(-50%);z-index:9999;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  width:90%;max-width:380px;
}
.toast{
  background:rgba(15,23,42,0.92);color:#fff;padding:10px 16px;border-radius:24px;
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 6px 20px rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.12);

  animation:toastIn .22s cubic-bezier(0.16,1,0.3,1);
  pointer-events:auto;text-align:center;
}
.toast.toast-out{
  animation:toastOut .2s cubic-bezier(0.4,0,1,1) forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(8px) scale(0.96)}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
}

function initDlgInteractions(){
  const d=$('#dlg');
  if(!d||d._inited)return;
  d._inited=true;

  let startY=0,startX=0,currentY=0,startTime=0;
  let isDragging=false,canDrag=false;

  d.addEventListener('touchstart',e=>{
    if(!d.open||isDlgClosing)return;
    const t=e.touches[0];
    startY=t.clientY;
    startX=t.clientX;
    currentY=startY;
    startTime=Date.now();
    isDragging=false;
    window._dlgDragged=false;
    const target=e.target;
    const isHandle=target.closest&&target.closest('.dlg-drag-bar');
    const isInput=target.matches&&target.matches('input, textarea, select, button, a');
    if(isHandle||(d.scrollTop<=0&&!isInput)){
      canDrag=true;
    }else{
      canDrag=false;
    }
  },{passive:true});

  d.addEventListener('touchmove',e=>{
    if(!canDrag||!d.open||isDlgClosing)return;
    const t=e.touches[0];
    const dy=t.clientY-startY;
    const dx=t.clientX-startX;
    if(!isDragging){
      if(dy>6&&Math.abs(dy)>Math.abs(dx)){
        if(d.scrollTop<=0||(e.target.closest&&e.target.closest('.dlg-drag-bar'))){
          isDragging=true;
          window._dlgDragged=true;
        }else{
          canDrag=false;
          return;
        }
      }else if(dy<-4){
        canDrag=false;
        return;
      }
    }
    if(isDragging&&dy>0){
      if(e.cancelable)e.preventDefault();
      currentY=t.clientY;
      d.style.transition='none';
      d.style.transform=`translateY(${dy}px)`;
    }
  },{passive:false});

  const onDragEnd=()=>{
    if(!canDrag)return;
    if(isDragging){
      const dy=currentY-startY;
      const dt=Math.max(1,Date.now()-startTime);
      const vel=dy/dt;

      }

    }
    isDragging=false;
    canDrag=false;
  };

  d.addEventListener('touchend',onDragEnd,{passive:true});
  d.addEventListener('touchcancel',()=>{
    if(isDragging){
      d.style.transition='transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)';
      d.style.transform='translateY(0)';
      setTimeout(()=>{d.style.transform='';d.style.transition='';},210);
    }

    canDrag=false;

  },{passive:true});

  d.addEventListener('mousedown',e=>{
    if(!d.open||isDlgClosing)return;
    const isHandle=e.target.closest&&(e.target.closest('.dlg-drag-bar')||e.target.closest('.dlg-handle'));
    if(!isHandle)return;
    startY=e.clientY;
    currentY=startY;
    startTime=Date.now();
    isDragging=false;
    window._dlgDragged=false;
    const onMouseMove=me=>{
      const dy=me.clientY-startY;
      if(!isDragging&&dy>5){
        isDragging=true;
        window._dlgDragged=true;
      }
      if(isDragging&&dy>0){
        currentY=me.clientY;
        d.style.transition='none';
        d.style.transform=`translateY(${dy}px)`;
      }
    };
    const onMouseUp=()=>{
      window.removeEventListener('mousemove',onMouseMove);
      window.removeEventListener('mouseup',onMouseUp);
      if(isDragging){
        const dy=currentY-startY;
        if(dy>60){
          d.style.transition='transform 0.2s cubic-bezier(0.4, 0, 1, 1)';
          d.style.transform='translateY(105%)';
          setTimeout(()=>closeDlg(),180);
        }else{
          d.style.transition='transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)';
          d.style.transform='translateY(0)';
          setTimeout(()=>{
            if(d.open&&!isDlgClosing){
              d.style.transform='';
              d.style.transition='';
            }
          },210);
        }
        setTimeout(()=>{window._dlgDragged=false;},150);
      }
      isDragging=false;
    };
    window.addEventListener('mousemove',onMouseMove);
    window.addEventListener('mouseup',onMouseUp);
  });

  d.addEventListener('click',e=>{
    if(e.target===d){
      const r=d.getBoundingClientRect();
      const inBox=(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);
      if(!inBox)closeDlg();
    }
  });

  d.addEventListener('cancel',e=>{
    e.preventDefault();
    closeDlg();
  });
}

async function rmDemoDirect(){
  const ids=new Set(S.items.filter(i=>i.demo=='1').map(i=>i.id));
  const count=ids.size;
  S.items=S.items.filter(i=>!ids.has(i.id));
  S.logs=S.logs.filter(l=>!ids.has(l.id));
  const delStateKeys=[];
  for(const k of Object.keys(S.states)){
    if(ids.has(S.states[k]?.id||k.split('|')[0])){
      delStateKeys.push(k);
      delete S.states[k];
    }
  }
  await delMany('items',[...ids]);
  await delMany('states',delStateKeys);
  reidx();
  closeDlg();
  render();
  if($('#side-drawer')?.classList.contains('open'))renderSettingsSide();

function toast(msg,dur=3200){
  const c=$('#toast-container');
  if(!c)return;
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<span>✓</span> <span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(()=>{
    t.classList.add('toast-out');
    t.addEventListener('animationend',()=>t.remove(),{once:true});
    setTimeout(()=>t.remove(),250);
  },dur);
}
async function delFilteredWords(){

async function delBatch(ids,msg,successToastMsg){
  if(!ids||!ids.length)return;
  const count=ids.length;
  const set=new Set(ids);
  const deletedItemKeys=S.items.filter(i=>set.has(i.id)).map(i=>i.k||i.id);
  S.items=S.items.filter(i=>!set.has(i.id));
  const delStateKeys=[];
  for(const k of Object.keys(S.states)){
    const st=S.states[k];
    if(set.has(st?.id||k.split('|')[0])){
      delStateKeys.push(k);
      delete S.states[k];
    }
  }
  if(deletedItemKeys.length)await delMany('items',deletedItemKeys);
  if(delStateKeys.length)await delMany('states',delStateKeys);

    A.ids=A.ids.filter(id=>!set.has(id));
    if(A.cur&&set.has(A.cur.k?.split('|')[0]))A.cur=null;
    if(A.introId&&set.has(A.introId))A.introId=null;
  }
  reidx();
  closeDlg();
  render();
  if($('#side-drawer')?.classList.contains('open'))renderSettingsSide();
  toast(successToastMsg||`Deleted ${count} ${count===1?'word':'words'}`);
