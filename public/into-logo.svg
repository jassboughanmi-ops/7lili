<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="100%" height="100%">
  <defs>
    <!-- German Flag Clip -->
    <clipPath id="german-flag-clip">
      <rect x="382" y="55" width="70" height="48" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <!-- === INTO === -->
  <!-- 'I' with diagonal slash & red corner -->
  <g id="letter-I">
    <!-- Red top-left corner triangle -->
    <path d="M 26,22 L 53,22 L 26,49 Z" fill="#DE222B" />
    <!-- Blue trunk with matching diagonal slice at top -->
    <path d="M 53,30 L 53,130 L 26,130 L 26,57 Z" fill="#0B3C68" />
  </g>

  <!-- 'N' in deep navy blue -->
  <path id="letter-N" d="M 74,22 L 101,22 L 148,93 L 148,22 L 174,22 L 174,130 L 147,130 L 101,59 L 101,130 L 74,130 Z" fill="#0B3C68" />

  <!-- 'T' in deep navy blue -->
  <path id="letter-T" d="M 188,22 L 286,22 L 286,48 L 251,48 L 251,130 L 223,130 L 223,48 L 188,48 Z" fill="#0B3C68" />

  <!-- 'O' with German flag badge -->
  <g id="letter-O">
    <!-- The outer squircle / rounded ring in navy blue -->
    <path fill-rule="evenodd" d="M 342,22 C 314,22 298,38 298,66 L 298,86 C 298,114 314,130 342,130 L 378,130 C 406,130 422,114 422,86 L 422,66 C 422,38 406,22 378,22 Z M 344,48 C 333,48 326,55 326,67 L 326,85 C 326,97 333,104 344,104 L 376,104 C 387,104 394,97 394,85 L 394,67 C 394,55 387,48 376,48 Z" fill="#0B3C68" />

    <!-- German Flag overlapping the right edge of 'O' -->
    <g clip-path="url(#german-flag-clip)">
      <!-- Black stripe -->
      <rect x="382" y="55" width="70" height="16" fill="#181818"/>
      <!-- Red stripe -->
      <rect x="382" y="71" width="70" height="16" fill="#DE222B"/>
      <!-- Gold/Yellow stripe -->
      <rect x="382" y="87" width="70" height="16" fill="#FFCC00"/>
    </g>
    <!-- Flag border outline -->
    <rect x="382" y="55" width="70" height="48" rx="8" ry="8" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.95"/>
  </g>

  <!-- === ACADEMY === -->
  <text x="245" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="16" fill="#DE222B">ACADEMY</text>
</svg>
